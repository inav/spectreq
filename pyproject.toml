[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "spectreq-py"
version = "0.1.0"
description = "High-efficiency HTTP client with browser impersonation (Python bindings)"
requires-python = ">=3.11"
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "spectreq"
