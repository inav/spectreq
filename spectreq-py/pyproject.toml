[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "spectreq-py"
version = "0.1.1"
description = "High-efficiency HTTP client with browser impersonation"
requires-python = ">=3.11"
license = {text = "MIT OR Apache-2.0"}
authors = [
    {name = "Spectre Contributors"},
]
urls = {Repository = "https://github.com/inav/spectreq"}
keywords = ["http", "client", "browser", "fingerprinting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "spectreq"
