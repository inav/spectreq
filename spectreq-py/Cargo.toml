[package]
name = "spectreq-py"
version = "0.1.1"
edition = "2021"
rust-version = "1.93.0"
authors = ["Spectre Contributors"]
license = "MIT OR Apache-2.0"
description = "Python bindings for Spectre HTTP client with browser impersonation"
repository = "https://github.com/inav/spectre"
keywords = ["http", "client", "browser", "fingerprinting", "python"]
categories = ["web-programming::http-client", "api-bindings"]

[lib]
name = "spectreq"
crate-type = ["cdylib"]

[dependencies]
spectreq = { path = "..", default-features = false }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"] }
pyo3-async-runtimes = { version = "0.27", features = ["tokio-runtime"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
url = "2.5"
