version: 2
updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(rust):"
    labels:
      - dependencies
      - rust
    groups:
      rust-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Python dependencies (spectreq-py)
  - package-ecosystem: pip
    directory: /spectreq-py
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(python):"
    labels:
      - dependencies
      - python

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci:"
    labels:
      - ci
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
